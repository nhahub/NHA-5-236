<div class="min-h-screen bg-[var(--background)]">

  <header class="flex items-center justify-between px-8 py-4
                 bg-[var(--surface)] border-b border-[var(--divider)]">

    <div class="flex items-center gap-3 cursor-pointer" routerLink="/home">
      <img src="/images/app_logo.png" alt="CommitMa3ana Logo" class="w-10 h-10 rounded-2xl object-cover shadow-md" />
      <span class="text-xl font-semibold text-[var(--primary)]">
        COMMIT<span style="color: var(--secondary);">Ma3ana</span>
      </span>
    </div>
    <div class="flex items-center gap-4">

      <button (click)="toggleTheme()"
        class="p-2 rounded-lg border border-[var(--outline)] hover:bg-[var(--background)]">
        {{ isDark ? '☀️' : '🌙' }}
      </button>

      @if (student(); as s) {
      <div class="text-right hidden sm:block">
        <p class="text-sm font-semibold text-[var(--text-primary)]">{{ fullName }}</p>
      </div>

      <!-- Avatar -->
      @if (s.image) {
      <img appImgFallback [src]="s.image" [srcFallback]="''" [errorFallback]="'/assets/images/user-default.jpg'"
        [alt]="fullName" class="w-9 h-9 rounded-full object-cover border-2 border-[var(--secondary)]" />
      } @else {
      <div class="w-9 h-9 rounded-full bg-[var(--primary)] text-white flex items-center justify-center 
                  text-xs font-bold border-2 border-[var(--secondary)] shadow-sm select-none">
        {{ initials }}
      </div>
      }
      } @else {
      <!-- Skeleton loading -->
      <div class="h-4 w-28 bg-[var(--outline)] rounded animate-pulse hidden sm:block"></div>
      <div class="w-9 h-9 rounded-full bg-[var(--outline)] animate-pulse"></div>
      }

    </div>
  </header>

  <!-- Body -->
  <div class="flex gap-6 p-6 max-w-6xl mx-auto">
    <aside class="w-56 shrink-0">
      <app-side-bar-profile />
    </aside>
    <main class="flex-1 min-w-0">
      <router-outlet />
    </main>
  </div>

</div>

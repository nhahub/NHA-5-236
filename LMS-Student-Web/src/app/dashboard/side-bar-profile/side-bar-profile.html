<div class="bg-[var(--surface)] rounded-2xl border border-[var(--outline)] p-2">

  <a routerLink="/dashboard/profile"
     routerLinkActive="!bg-[var(--primary)] !text-white"
     [routerLinkActiveOptions]="{ exact: false }"
     class="flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-medium
            text-[var(--text-secondary)] hover:bg-[var(--background)] transition-colors duration-150">
    <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 shrink-0"
         fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8">
      <path stroke-linecap="round" stroke-linejoin="round"
        d="M15.75 6a3.75 3.75 0 1 1-7.5 0 3.75 3.75 0 0 1 7.5 0Z
           M4.501 20.118a7.5 7.5 0 0 1 14.998 0A17.933 17.933 0 0 1 12
           21.75c-2.676 0-5.216-.584-7.499-1.632Z"/>
    </svg>
    Profile
  </a>


  <a routerLink="/dashboard/security"
     routerLinkActive="!bg-[var(--primary)] !text-white"
     [routerLinkActiveOptions]="{ exact: false }"
     class="flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-medium
            text-[var(--text-secondary)] hover:bg-[var(--background)] transition-colors duration-150">
    <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 shrink-0"
         fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8">
      <path stroke-linecap="round" stroke-linejoin="round"
        d="M9 12.75 11.25 15 15 9.75m-3-7.036A11.959 11.959 0 0 1 3.598 6
           11.99 11.99 0 0 0 3 9.749c0 5.592 3.824 10.29 9 11.623

           c-3.196 0-6.1-1.248-8.25-3.285Z"/>
    </svg>
    Security & Password
  </a>


</div>
